services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexafinance-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: nexafinance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexafinance"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
